name: CI

on:
  pull_request:
    branches: [Dev2.1]
  push:
    branches: [Dev2.1]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - run: ruff check app/

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # app/config.py::Settings requires SUPABASE_URL/SUPABASE_KEY just to
      # import - there's no .env file in a fresh checkout, so without these
      # every test fails at collection time before it even runs. Pointed at
      # the same disposable test project as the TEST_ pair below: a CI
      # runner is ephemeral and has no "real" project to protect, so there's
      # no meaningful distinction here the way there is on a dev machine.
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - run: >
          pytest
          --ignore=tests/integration/test_iban_ocr_api.py
          --ignore=tests/integration/test_id_ocr_api.py
