{% extends "base.html" %}
{% block title %}Înregistrare - BanK Banca{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 2rem 0;">
  <div class="card" style="width: 100%; max-width: 500px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Creează un cont nou</h1>
      <p style="color: var(--text-secondary); font-size: 0.875rem;">Alătură-te BanK Banca astăzi.</p>
    </div>

    <form id="register-form">
      <div class="grid-2">
        <div class="form-group">
          <label>Prenume</label>
          <input type="text" name="first_name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Nume de familie</label>
          <input type="text" name="last_name" class="form-control" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>CNP (13 cifre)</label>
        <input type="text" name="national_id" class="form-control" pattern="\d{13}" required placeholder="Ex: 1900101123456">
      </div>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      
      <div class="form-group">
        <label>Parolă (min. 8 caractere)</label>
        <input type="password" name="password" class="form-control" minlength="8" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Telefon (Opțional)</label>
          <input type="tel" name="phone" class="form-control">
        </div>
        <div class="form-group">
          <label>Adresă (Opțional)</label>
          <input type="text" name="address" class="form-control">
        </div>
      </div>

      <button type="submit" class="btn mt-4" style="width: 100%;">Înregistrare</button>
    </form>
    <p id="register-error" class="error" style="text-align: center;"></p>
    
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
      Ai deja un cont? <a href="{{ url_for('login') }}" class="text-teal" style="text-decoration: none; font-weight: 500;">Autentifică-te</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.querySelector('.top-bar').style.display = 'none'; // Hide top bar for auth pages

  document.getElementById("register-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = new FormData(event.target);
    const errorEl = document.getElementById("register-error");
    errorEl.textContent = "";
    
    const btn = event.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = "Se procesează...";

    try {
      await apiFetch("/auth/register", {
        method: "POST",
        body: JSON.stringify({
          email: form.get("email"),
          password: form.get("password"),
          first_name: form.get("first_name"),
          last_name: form.get("last_name"),
          national_id: form.get("national_id"),
          phone: form.get("phone") || null,
          address: form.get("address") || null,
        }),
      });
      window.location.href = "{{ url_for('index') }}";
    } catch (err) {
      errorEl.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "Înregistrare";
    }
  });
</script>
{% endblock %}
