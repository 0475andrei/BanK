{% extends "base.html" %}
{% block title %}Autentificare - BanK Banca{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
  <div class="card" style="width: 100%; max-width: 400px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: inline-block; background: var(--accent-teal); padding: 12px; border-radius: 12px; margin-bottom: 1rem;">
        <i data-lucide="building" style="color: black;" width="32" height="32"></i>
      </div>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">BanK Banca</h1>
      <p style="color: var(--text-secondary); font-size: 0.875rem;">Conectați-vă la contul dumneavoastră</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required placeholder="adresa@email.com">
      </div>
      <div class="form-group mb-6">
        <label>Parolă</label>
        <input type="password" name="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" style="width: 100%;">Autentificare</button>
    </form>
    <p id="login-error" class="error" style="text-align: center;"></p>
    
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
      Nu ai un cont? <a href="{{ url_for('register') }}" class="text-teal" style="text-decoration: none; font-weight: 500;">Înregistrează-te</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.querySelector('.top-bar').style.display = 'none'; // Hide top bar for auth pages
  
  document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = new FormData(event.target);
    const errorEl = document.getElementById("login-error");
    errorEl.textContent = "";
    try {
      await apiFetch("/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email: form.get("email"),
          password: form.get("password"),
        }),
      });
      window.location.href = "{{ url_for('index') }}";
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });
</script>
{% endblock %}
