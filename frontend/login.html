<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - BanK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="auth-card">
            <div class="logo">
                <img class="logo-mark" src="static/bank-mark.jpg" alt="">
                <span class="logo-text">
                    <span class="logo-name">BanK</span>
                    <span class="logo-bank">BANCA</span>
                    <span class="logo-tagline">CONFORTUL TAU FINANCIAR</span>
                </span>
            </div>

            <!-- Recognized-device path: shown only after GET /trusted-devices/check
                 confirms this browser already completed OTP enrollment. -->
            <div id="device-login" hidden>
                <p class="auth-subtitle">Bine ai revenit, <span id="device-email"></span></p>
                <p class="field-hint" style="margin-bottom: 20px;">
                    Acest calculator este recunoscut - introdu doar parola pentru a continua.
                </p>

                <div class="auth-error" id="device-error" hidden></div>

                <form id="device-login-form">
                    <label class="field-label" for="device-password">Password</label>
                    <div class="password-field-wrapper">
                        <input class="field-input" type="password" id="device-password" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" data-target="device-password" tabindex="-1" aria-label="Arată parola"><i data-lucide="eye"></i></button>
                    </div>

                    <button class="btn btn-primary auth-submit" type="submit">Continuă</button>
                </form>

                <p class="auth-switch"><a href="#" id="not-you-link">Nu ești tu? Autentifică-te cu alt cont</a></p>
                <p class="auth-switch"><a href="forgot-password.html">Ai uitat parola?</a></p>
            </div>

            <!-- Normal path: default until proven otherwise, and always
                 reachable via "Nu ești tu?" above. -->
            <div id="normal-login">
                <p class="auth-subtitle">Log in to your account</p>

                <div class="auth-error" id="auth-error" hidden></div>

                <form id="login-form">
                    <label class="field-label" for="email">Email</label>
                    <input class="field-input" type="email" id="email" name="email" required autocomplete="email">

                    <label class="field-label" for="password">Password</label>
                    <div class="password-field-wrapper">
                        <input class="field-input" type="password" id="password" name="password" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" data-target="password" tabindex="-1" aria-label="Arată parola"><i data-lucide="eye"></i></button>
                    </div>

                    <button class="btn btn-primary auth-submit" type="submit">Log in</button>
                </form>

                <!-- Face login: DIY, camera-based (see backend/app/modules/
                     face_auth) - toggles in place of the password form above. -->
                <div id="face-login-section" hidden>
                    <div class="auth-error" id="face-login-error" hidden></div>

                    <label class="field-label" for="face-login-email">Email</label>
                    <input class="field-input" type="email" id="face-login-email" required autocomplete="email">

                    <div class="face-camera-wrap" style="margin-top: 16px;">
                        <video id="face-login-video" autoplay playsinline muted></video>
                        <canvas id="face-login-canvas" hidden></canvas>
                    </div>

                    <button type="button" class="btn btn-secondary auth-submit" id="face-login-start-btn">Pornește camera</button>
                    <button type="button" class="btn btn-primary auth-submit" id="face-login-capture-btn" hidden>Login cu Face</button>
                </div>

                <p class="auth-switch"><a href="#" id="toggle-face-login">Login cu Face</a></p>
                <p class="auth-switch"><a href="forgot-password.html">Ai uitat parola?</a></p>
                <p class="auth-switch">No account yet? <a href="register.html">Register</a></p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="api.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();

        const deviceLoginPanel = document.getElementById('device-login');
        const normalLoginPanel = document.getElementById('normal-login');

        function showNormalLogin() {
            deviceLoginPanel.hidden = true;
            normalLoginPanel.hidden = false;
        }

        (async () => {
            try {
                const result = await apiFetch('/trusted-devices/check');
                if (result.trusted) {
                    document.getElementById('device-email').textContent = result.email;
                    deviceLoginPanel.hidden = false;
                    normalLoginPanel.hidden = true;
                }
            } catch {
                // Any failure here just falls back to the normal form -
                // this is a convenience shortcut, never a requirement.
            }
        })();

        document.getElementById('not-you-link').addEventListener('click', (event) => {
            event.preventDefault();
            showNormalLogin();
        });

        document.getElementById('device-login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const errorEl = document.getElementById('device-error');
            errorEl.hidden = true;
            try {
                await apiFetch('/trusted-devices/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        password: document.getElementById('device-password').value,
                    }),
                });
                window.location.href = 'index.html';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.hidden = false;
            }
        });

        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const errorEl = document.getElementById("auth-error");
            errorEl.hidden = true;
            try {
                await apiFetch("/auth/login", {
                    method: "POST",
                    body: JSON.stringify({
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value,
                    }),
                });
                window.location.href = "index.html";
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.hidden = false;
            }
        });

        /* --- Face login (DIY, camera-based) --- */
        const loginForm = document.getElementById("login-form");
        const faceSection = document.getElementById("face-login-section");
        const toggleFaceLink = document.getElementById("toggle-face-login");
        const faceVideo = document.getElementById("face-login-video");
        const faceCanvas = document.getElementById("face-login-canvas");
        const faceStartBtn = document.getElementById("face-login-start-btn");
        const faceCaptureBtn = document.getElementById("face-login-capture-btn");
        const faceErrorEl = document.getElementById("face-login-error");

        let faceLoginStream = null;

        function stopFaceLoginCamera() {
            if (faceLoginStream) {
                faceLoginStream.getTracks().forEach(track => track.stop());
                faceLoginStream = null;
            }
            faceVideo.srcObject = null;
            faceStartBtn.hidden = false;
            faceCaptureBtn.hidden = true;
        }

        toggleFaceLink.addEventListener("click", (event) => {
            event.preventDefault();
            const showingFace = !faceSection.hidden;
            faceSection.hidden = !faceSection.hidden;
            loginForm.hidden = !loginForm.hidden;
            toggleFaceLink.textContent = showingFace ? "Login cu Face" : "Login cu parolă";
            if (showingFace) stopFaceLoginCamera();
        });

        faceStartBtn.addEventListener("click", async () => {
            faceErrorEl.hidden = true;
            try {
                faceLoginStream = await navigator.mediaDevices.getUserMedia({ video: true });
                faceVideo.srcObject = faceLoginStream;
                faceStartBtn.hidden = true;
                faceCaptureBtn.hidden = false;
            } catch {
                faceErrorEl.textContent = "Nu s-a putut accesa camera. Verifică permisiunile browserului.";
                faceErrorEl.hidden = false;
            }
        });

        faceCaptureBtn.addEventListener("click", () => {
            faceErrorEl.hidden = true;
            const email = document.getElementById("face-login-email").value;
            if (!email) {
                faceErrorEl.textContent = "Introdu email-ul contului.";
                faceErrorEl.hidden = false;
                return;
            }

            faceCanvas.width = faceVideo.videoWidth;
            faceCanvas.height = faceVideo.videoHeight;
            faceCanvas.getContext("2d").drawImage(faceVideo, 0, 0);

            faceCanvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append("email", email);
                formData.append("file", blob, "face.jpg");
                try {
                    const res = await fetch(`${API_BASE_URL}/auth/face/login`, {
                        method: "POST",
                        credentials: "include",
                        body: formData,
                    });
                    if (!res.ok) {
                        const body = await res.json().catch(() => ({}));
                        throw new Error(body?.error?.message || `Request failed (${res.status})`);
                    }
                    window.location.href = "index.html";
                } catch (err) {
                    faceErrorEl.textContent = err.message;
                    faceErrorEl.hidden = false;
                }
            }, "image/jpeg", 0.92);
        });
    </script>
</body>
</html>
