<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetare parolă - BanK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="auth-card">
            <div class="logo"><h2>BanK.</h2></div>
            <p class="auth-subtitle">Resetare parolă</p>

            <!-- Step 1: request a code -->
            <div id="request-step">
                <p class="field-hint" style="margin-bottom: 20px;">
                    Introdu adresa de email a contului. Dacă există, primești un cod de 6 cifre prin Teams.
                </p>

                <div class="auth-error" id="request-error" hidden></div>

                <form id="request-form">
                    <label class="field-label" for="request-email">Email</label>
                    <input class="field-input" type="email" id="request-email" required autocomplete="email">

                    <button class="btn btn-primary auth-submit" type="submit">Trimite codul</button>
                </form>
            </div>

            <!-- Step 2: enter the code + new password -->
            <div id="reset-step" hidden>
                <div class="auth-success" id="request-success">
                    Dacă adresa există, un cod a fost trimis prin Teams. Verifică și folderul de spam al chat-ului 🙂
                </div>

                <div class="auth-error" id="reset-error" hidden></div>

                <form id="reset-form">
                    <label class="field-label" for="reset-code">Cod (6 cifre)</label>
                    <input class="field-input" type="text" id="reset-code" required inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="123456">

                    <label class="field-label" for="reset-new-password">Parolă nouă</label>
                    <input class="field-input" type="password" id="reset-new-password" minlength="8" required autocomplete="new-password">
                    <p class="field-hint">Cel puțin 8 caractere</p>

                    <button class="btn btn-primary auth-submit" type="submit">Resetează parola</button>
                </form>

                <p class="auth-switch">
                    Nu a venit codul? <a href="#" id="resend-code-link">Trimite din nou</a>
                </p>
            </div>

            <p class="auth-switch">Ți-ai amintit parola? <a href="login.html">Log in</a></p>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        const requestStep = document.getElementById('request-step');
        const resetStep = document.getElementById('reset-step');
        const requestForm = document.getElementById('request-form');
        const requestError = document.getElementById('request-error');
        const resetForm = document.getElementById('reset-form');
        const resetError = document.getElementById('reset-error');

        let submittedEmail = '';

        async function requestCode(email) {
            await apiFetch('/auth/forgot-password', {
                method: 'POST',
                body: JSON.stringify({ email }),
            });
            submittedEmail = email;
            requestStep.hidden = true;
            resetStep.hidden = false;
        }

        requestForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            requestError.hidden = true;
            try {
                await requestCode(document.getElementById('request-email').value);
            } catch (err) {
                requestError.textContent = err.message;
                requestError.hidden = false;
            }
        });

        document.getElementById('resend-code-link').addEventListener('click', async (event) => {
            event.preventDefault();
            resetError.hidden = true;
            try {
                await requestCode(submittedEmail);
            } catch (err) {
                resetError.textContent = err.message;
                resetError.hidden = false;
            }
        });

        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            resetError.hidden = true;
            try {
                await apiFetch('/auth/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: submittedEmail,
                        code: document.getElementById('reset-code').value,
                        new_password: document.getElementById('reset-new-password').value,
                    }),
                });
                window.location.href = 'login.html';
            } catch (err) {
                resetError.textContent = err.message;
                resetError.hidden = false;
            }
        });
    </script>
</body>
</html>
