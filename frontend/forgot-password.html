<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetare parolă - BanK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="auth-card">
            <div class="logo"><h2>BanK.</h2></div>
            <p class="auth-subtitle">Resetare parolă</p>

            <!-- Step 1: request a code -->
            <div id="request-step">
                <p class="field-hint" style="margin-bottom: 20px;">
                    Introdu adresa de email a contului. Dacă există, primești un cod de 6 cifre prin Teams.
                </p>

                <div class="auth-error" id="request-error" hidden></div>

                <form id="request-form">
                    <label class="field-label" for="request-email">Email</label>
                    <input class="field-input" type="email" id="request-email" required autocomplete="email">

                    <button class="btn btn-primary auth-submit" type="submit">Trimite codul</button>
                </form>
            </div>

            <!-- Step 2: verify the code alone, before showing any password field -->
            <div id="verify-step" hidden>
                <div class="auth-success" id="request-success">
                    Dacă adresa există, un cod a fost trimis prin Teams.
                </div>

                <div class="auth-error" id="verify-error" hidden></div>

                <form id="verify-form">
                    <label class="field-label" for="verify-code">Cod (6 cifre)</label>
                    <input class="field-input" type="text" id="verify-code" required inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="123456" autocomplete="one-time-code">

                    <button class="btn btn-primary auth-submit" type="submit">Verifică codul</button>
                </form>

                <p class="auth-switch">
                    Nu a venit codul? <a href="#" id="resend-code-link">Trimite din nou</a>
                </p>
            </div>

            <!-- Step 3: only reachable after the code above was confirmed valid -->
            <div id="password-step" hidden>
                <div class="auth-success">Cod confirmat. Alege o parolă nouă.</div>

                <div class="auth-error" id="password-error" hidden></div>

                <form id="password-form">
                    <label class="field-label" for="new-password">Parolă nouă</label>
                    <div class="password-field-wrapper">
                        <input class="field-input" type="password" id="new-password" minlength="8" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" data-target="new-password" tabindex="-1" aria-label="Arată parola"><i data-lucide="eye"></i></button>
                    </div>
                    <p class="field-hint">Cel puțin 8 caractere</p>

                    <label class="field-label" for="new-password-confirm">Confirmă parola nouă</label>
                    <div class="password-field-wrapper">
                        <input class="field-input" type="password" id="new-password-confirm" minlength="8" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" data-target="new-password-confirm" tabindex="-1" aria-label="Arată parola"><i data-lucide="eye"></i></button>
                    </div>

                    <button class="btn btn-primary auth-submit" type="submit">Resetează parola</button>
                </form>
            </div>

            <p class="auth-switch">Ți-ai amintit parola? <a href="login.html">Log in</a></p>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        const requestStep = document.getElementById('request-step');
        const verifyStep = document.getElementById('verify-step');
        const passwordStep = document.getElementById('password-step');

        const requestForm = document.getElementById('request-form');
        const requestError = document.getElementById('request-error');
        const verifyForm = document.getElementById('verify-form');
        const verifyError = document.getElementById('verify-error');
        const passwordForm = document.getElementById('password-form');
        const passwordError = document.getElementById('password-error');

        let submittedEmail = '';
        let verifiedCode = '';

        // Comodul (register.html) links here with ?email=... when a
        // registration attempt hits an existing account, so the user
        // doesn't have to retype what they just typed in the chat.
        const prefillEmail = new URLSearchParams(window.location.search).get('email');
        if (prefillEmail) {
            document.getElementById('request-email').value = prefillEmail;
        }

        function showStep(step) {
            requestStep.hidden = step !== 'request';
            verifyStep.hidden = step !== 'verify';
            passwordStep.hidden = step !== 'password';
        }

        async function requestCode(email) {
            await apiFetch('/auth/forgot-password', {
                method: 'POST',
                body: JSON.stringify({ email }),
            });
            submittedEmail = email;
            showStep('verify');
        }

        requestForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            requestError.hidden = true;
            try {
                await requestCode(document.getElementById('request-email').value);
            } catch (err) {
                requestError.textContent = err.message;
                requestError.hidden = false;
            }
        });

        document.getElementById('resend-code-link').addEventListener('click', async (event) => {
            event.preventDefault();
            verifyError.hidden = true;
            try {
                await requestCode(submittedEmail);
            } catch (err) {
                verifyError.textContent = err.message;
                verifyError.hidden = false;
            }
        });

        // Step 2: verify the code alone - the backend checks it but does not
        // consume it, so the password form only appears once this succeeds.
        verifyForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            verifyError.hidden = true;
            const code = document.getElementById('verify-code').value;
            try {
                await apiFetch('/auth/verify-reset-code', {
                    method: 'POST',
                    body: JSON.stringify({ email: submittedEmail, code }),
                });
                verifiedCode = code;
                showStep('password');
            } catch (err) {
                verifyError.textContent = err.message;
                verifyError.hidden = false;
            }
        });

        // Step 3: actually consume the code and set the new password.
        passwordForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            passwordError.hidden = true;

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('new-password-confirm').value;
            if (newPassword !== confirmPassword) {
                passwordError.textContent = 'Parolele nu coincid.';
                passwordError.hidden = false;
                return;
            }

            try {
                await apiFetch('/auth/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: submittedEmail,
                        code: verifiedCode,
                        new_password: newPassword,
                    }),
                });
                window.location.href = 'login.html';
            } catch (err) {
                passwordError.textContent = err.message;
                passwordError.hidden = false;
            }
        });
    </script>
</body>
</html>
