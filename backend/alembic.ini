[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally omitted: app/db/migrations/env.py reads the
# real URL from app.config.settings (DATABASE_URL env var) so it is never
# duplicated between .env and alembic.ini.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
