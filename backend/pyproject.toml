[project]
name = "bank-backend"
version = "0.1.0"
description = "BanK backend API (banking core + AI agent layer)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase>=2.31.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "bcrypt>=4.2",
    # AI layer (app/ai): Azure OpenAI is reached through the OpenAI SDK.
    "openai>=1.40",
    # id_ocr module: wraps the system tesseract-ocr binary (installed in
    # the Dockerfile, apt package tesseract-ocr + tesseract-ocr-ron).
    "pytesseract>=0.3.10",
    "Pillow>=10.4",
    # iban_ocr module: renders each PDF page to an image so a bank
    # statement/invoice PDF (not just a photo) can be OCR'd. Pure-Python
    # wheel (bundles its own PDF renderer) - no system package needed,
    # unlike the pdf2image+poppler alternative.
    "pymupdf>=1.24",
    # Required by FastAPI's UploadFile/File(...) to parse multipart/form-data.
    "python-multipart>=0.0.12",
    # face_auth module: local face enrollment/verification (DIY, not
    # WebAuthn) - dlib is a heavy native build, see Dockerfile.
    "face-recognition>=1.3.0",
    # face-recognition-models (pulled in by face-recognition above, last
    # released 2018) still imports the old `pkg_resources` API at runtime.
    # python:3.12-slim doesn't ship it by default, AND recent setuptools
    # (81+) dropped pkg_resources entirely as part of its own deprecation -
    # so this needs pinning below that, not just "setuptools" unpinned.
    "setuptools<81",
    # app/ai/knowledge: RAG ingestion for the docs agent. Document
    # Intelligence extracts structured text (tables as rows, not flattened
    # prose) from a PDF; embeddings + storage reuse Azure OpenAI (via
    # `openai` above) and Supabase's pgvector (via `supabase` above) - no
    # extra dependency needed for either of those two.
    "azure-ai-documentintelligence>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# A's banking tests are async; [B]'s AI tests under tests/ai are plain sync
# functions, which "auto" leaves alone.
asyncio_mode = "auto"
# One testpath covers both: tests/unit, tests/integration and tests/ai.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: X = Depends(get_x)` /
# Header(...) / Query(...) / etc. - a function call in a default argument
# is how it's meant to be used, not the mutable-default-argument footgun
# B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Security",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
