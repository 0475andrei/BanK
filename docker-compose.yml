# The whole app: database, API, and frontend.
#
#   docker compose up -d --build     start everything
#   docker compose down              stop everything
#
# (./run.sh and .\run.ps1 are thin wrappers around exactly this.)
name: bank

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    ports:
      - "5432:5432"
    volumes:
      - bank_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      # Optional so a fresh clone can `docker compose up` before anyone has
      # made a .env; app/config.py has sensible defaults for everything
      # except the AI layer's Azure keys.
      - path: ./backend/.env
        required: false
    environment:
      # Overrides the .env value so the app always reaches Postgres via the
      # compose network, regardless of what a developer put in .env for
      # local/non-docker use.
      DATABASE_URL: postgresql+asyncpg://bank:bank@db:5432/bank
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  bank_pg_data:
